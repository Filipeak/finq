[project]
name = "finq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "requests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
